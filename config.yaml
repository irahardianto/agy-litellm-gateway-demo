# =============================================================================
# Antigravity Enterprise Gateway — LiteLLM Proxy Configuration
# =============================================================================
# Docs: https://docs.litellm.ai/docs/proxy/configs
#
# The Antigravity CLI (`agy`) talks to the gateway using the Google GenAI protocol:
#   POST /v1beta/models/{model}:streamGenerateContent?alt=sse
#   POST /v1beta/models/{model}:generateContent
#
# LiteLLM Proxy natively exposes these endpoints:
#   - Vertex AI / GEAP Gemini models (`vertex_ai/gemini-*`) are routed natively.
#   - Vertex AI / GEAP Partner models (`vertex_ai/claude-*`) and third-party
#     providers (`openai/*`, `anthropic/*`, `bedrock/*`, ...) are automatically
#     translated between Google GenAI format and Chat Completions / Messages format.
#
# (GEAP = Gemini Enterprise Agent Platform, formerly Vertex AI. LiteLLM still uses
#  the `vertex_ai/` provider prefix and `vertex_*` parameter names.)
#
# IMPORTANT: this file is baked into the Cloud Run container image. Any change
# here (adding / removing a model) needs a full `./deploy.sh` (not --sync-models).
# =============================================================================

model_list:
  # ---------------------------------------------------------------------------
  # 1. Antigravity Tool-Enabled Gateway Routes
  #    Mapped to Anthropic Claude on Vertex AI / GEAP so Antigravity CLI (`agy`)
  #    sends native tools and receives executed tool results seamlessly.
  # ---------------------------------------------------------------------------
  - model_name: gemini-3.8-flash
    litellm_params:
      model: vertex_ai/claude-sonnet-5
      vertex_project: os.environ/GCP_PROJECT_ID
      vertex_location: global

  - model_name: gemini-3.7-flash
    litellm_params:
      model: vertex_ai/claude-opus-5-5
      vertex_project: os.environ/GCP_PROJECT_ID
      vertex_location: global

  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: vertex_ai/gemini-3.1-pro-preview
      vertex_project: os.environ/GCP_PROJECT_ID
      vertex_location: global

  # ---------------------------------------------------------------------------
  # 2. Vertex AI / GEAP — Anthropic Claude Partner Models (Global Endpoint)
  #    IMPORTANT: Each Claude model below MUST be enabled once in your GCP
  #    project's Model Garden before it can be served:
  #      https://console.cloud.google.com/vertex-ai/model-garden
  #
  #    During `./deploy.sh`, each model in `model_list` is probed automatically:
  #      - Models enabled in Model Garden are marked ACTIVE and written to
  #        `admin_settings.json` and `gateway.env`.
  #      - Models not yet enabled in Model Garden (HTTP 404/403) are skipped
  #        from the client config until you enable them. Because they are
  #        already listed here, enabling them later only needs --sync-models.
  #
  #    Tip: it's fine to list models you haven't enabled yet; that is what
  #    makes the fast `--sync-models` path work for them later.
  # ---------------------------------------------------------------------------
  - model_name: claude-sonnet-5
    litellm_params:
      model: vertex_ai/claude-sonnet-5
      vertex_project: os.environ/GCP_PROJECT_ID
      vertex_location: global

  - model_name: claude-opus-5
    litellm_params:
      model: vertex_ai/claude-opus-5
      vertex_project: os.environ/GCP_PROJECT_ID
      vertex_location: global

  - model_name: claude-opus-5-5
    litellm_params:
      model: vertex_ai/claude-opus-5-5
      vertex_project: os.environ/GCP_PROJECT_ID
      vertex_location: global

  - model_name: claude-fable-5
    litellm_params:
      model: vertex_ai/claude-fable-5
      vertex_project: os.environ/GCP_PROJECT_ID
      vertex_location: global

  # ---------------------------------------------------------------------------
  # 3. Optional: Additional Vertex AI / GEAP Gemini & Model Garden Models
  #    To add another model (e.g. Claude 4.6, Haiku 4.5, Gemini 2.5 Pro/Flash):
  #      1. If it is a Partner model (Claude, Llama, etc.), enable it in
  #         Model Garden for your project.
  #      2. Uncomment (or add) its block below. Use the exact Model ID shown on
  #         the Model Garden card.
  #      3. Re-run `./deploy.sh --project YOUR_GCP_PROJECT_ID` (full deploy).
  # ---------------------------------------------------------------------------
  # - model_name: gemini-2.5-pro
  #   litellm_params:
  #     model: vertex_ai/gemini-2.5-pro
  #     vertex_project: os.environ/GCP_PROJECT_ID
  #     vertex_location: global
  #
  # - model_name: gemini-2.5-flash
  #   litellm_params:
  #     model: vertex_ai/gemini-2.5-flash
  #     vertex_project: os.environ/GCP_PROJECT_ID
  #     vertex_location: global
  #
  # - model_name: claude-sonnet-4-6
  #   litellm_params:
  #     model: vertex_ai/claude-sonnet-4-6
  #     vertex_project: os.environ/GCP_PROJECT_ID
  #     vertex_location: global
  #
  # - model_name: claude-opus-4-6
  #   litellm_params:
  #     model: vertex_ai/claude-opus-4-6
  #     vertex_project: os.environ/GCP_PROJECT_ID
  #     vertex_location: global
  #
  # - model_name: claude-haiku-4-5@20251001
  #   litellm_params:
  #     model: vertex_ai/claude-haiku-4-5@20251001
  #     vertex_project: os.environ/GCP_PROJECT_ID
  #     vertex_location: global

  # ---------------------------------------------------------------------------
  # 4. Optional: External (non-GCP) Providers — Anthropic API, OpenAI, Bedrock...
  #    Out of scope for this repo's turnkey flow, but LiteLLM supports 100+
  #    providers: https://docs.litellm.ai/docs/providers
  #    To wire one in:
  #      1. Store the provider API key in Secret Manager and grant
  #         `antigravity-gateway-sa` `roles/secretmanager.secretAccessor` on it.
  #      2. Add it to `--set-secrets` in deploy.sh (e.g. ANTHROPIC_API_KEY=anthropic-api-key:latest).
  #      3. Uncomment / add the model below and run a full `./deploy.sh`.
  #    The probe, admin_settings.json and gateway.env generation work the same way.
  #    Note: traffic to these providers leaves GCP and is billed by that provider.
  # ---------------------------------------------------------------------------
  # - model_name: anthropic-claude-sonnet-5      # Anthropic API (direct)
  #   litellm_params:
  #     model: anthropic/claude-sonnet-5
  #     api_key: os.environ/ANTHROPIC_API_KEY
  #
  # - model_name: gpt-4o                          # OpenAI API (direct)
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY
  #
  # - model_name: bedrock-claude-sonnet           # AWS Bedrock
  #   litellm_params:
  #     model: bedrock/anthropic.claude-3-7-sonnet-20250219-v1:0
  #     aws_region_name: us-east-1

# =============================================================================
# LiteLLM Router Settings — Aliases, Retries, and Automatic Fallbacks
# =============================================================================
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 600
  allowed_fails: 3
  cooldown_time: 30

  # Shorthand and internal Antigravity model ID aliases -> canonical model groups
  model_group_alias:
    # Gemini effort & shorthand aliases
    gemini-3.8-flash-high: gemini-3.8-flash
    gemini-3.8-flash-medium: gemini-3.8-flash
    gemini-3.8-flash-low: gemini-3.8-flash
    gemini-3.7-flash-high: gemini-3.7-flash
    gemini-3.7-flash-medium: gemini-3.7-flash
    gemini-3.7-flash-low: gemini-3.7-flash
    gemini-3.6-flash: gemini-3.7-flash
    gemini-3.5-flash: gemini-3.7-flash
    gemini-3.1-pro: gemini-3.1-pro-preview
    gemini-3.1-pro-high: gemini-3.1-pro-preview
    gemini-3.1-pro-low: gemini-3.1-pro-preview
    gemini-3.1-pro-low-thinking: gemini-3.1-pro-preview
    gemini-3.1-flash-lite: gemini-3.7-flash
    gemini-3.1-flash-lite-preview: gemini-3.7-flash

    # Claude shorthand & thinking aliases
    sonnet-5: claude-sonnet-5
    opus-5: claude-opus-5
    opus-5-5: claude-opus-5-5
    opus-5.5: claude-opus-5-5
    claude-opus-5.5: claude-opus-5-5
    fable-5: claude-fable-5
    claude-sonnet-5-thinking: claude-sonnet-5
    claude-opus-5-thinking: claude-opus-5
    claude-opus-5-5-thinking: claude-opus-5-5

  # Automatic fallback chains if a model group hits quota (429) or transient 5xx.
  # Only include models here that are enabled in your project.
  fallbacks:
    - gemini-3.8-flash:
        - claude-sonnet-5
    - gemini-3.7-flash:
        - claude-opus-5-5
        - claude-opus-5
    - gemini-3.1-pro-preview:
        - gemini-3.8-flash
    - claude-opus-5-5:
        - claude-opus-5
        - claude-sonnet-5
    - claude-opus-5:
        - claude-sonnet-5

# =============================================================================
# LiteLLM Runtime Settings & Antigravity Protojson Compatibility Plugin
# =============================================================================
litellm_settings:
  drop_params: true
  modify_params: true
  set_verbose: false
  callbacks:
    - callbacks.antigravity_compat

# =============================================================================
# General Proxy Settings — Authentication & Master Key
# =============================================================================
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
